# Publie la page de la veille sur GitHub Pages à chaque modification de main
# (veille quotidienne par la routine cloud, ou fiche ajoutée à la main).
# Deux jobs séparés (construction puis déploiement), comme le modèle officiel
# de GitHub : le déploiement ne démarre qu'une fois l'archive de la page bien
# enregistrée, ce qui évite l'erreur « No artifacts named github-pages ».
name: Publier la page de la veille

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Générer la page
        run: python3 outils/generer_page.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: page/site

  publier:
    needs: construire
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - name: Déployer sur GitHub Pages
        id: deploiement
        uses: actions/deploy-pages@v4
      - name: Nouvel essai si GitHub n'a pas répondu
        if: failure()
        id: deploiement2
        uses: actions/deploy-pages@v4
