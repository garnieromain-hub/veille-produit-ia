# Publie la page de la veille sur GitHub Pages à chaque modification de main
# (veille du lundi par la routine cloud, ou fiche ajoutée à la main).
name: Publier la page de la veille

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publier:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Générer la page
        run: python3 outils/generer_page.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: page/site
      - id: deploiement
        uses: actions/deploy-pages@v4
